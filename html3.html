    <h2>Formulario de Contacto</h2>

    <!-- FORMULARIO MODIFICADO SEGÚN EL EJEMPLO 9 -->

    <FORM ACTION="mailto:correo@ejemplo.com" METHOD="POST" ENCTYPE="TEXT/PLAIN">

        Escribe tu nombre:
        <BR>
        <INPUT TYPE="TEXT" NAME="Nombre" SIZE="30" MAXLENGTH="40">

        <BR><BR>

        Escribe tu Gmail:
        <BR>
        <INPUT TYPE="TEXT" NAME="Gmail" SIZE="30" MAXLENGTH="50">

        <BR><BR>

        Escribe tu dirección:
        <BR>
        <INPUT TYPE="TEXT" NAME="Direccion" SIZE="30" MAXLENGTH="60">

        <BR><BR>

        Escribe tu teléfono:
        <BR>
        <INPUT TYPE="TEXT" NAME="Telefono" SIZE="20" MAXLENGTH="20">

        <BR><BR>

        <INPUT TYPE="submit" VALUE="Enviar">
        <INPUT TYPE="reset" VALUE="Borrar">

    </FORM>

    <BR><BR>

    Si el formulario no funciona, puedes escribirnos directamente a:
    <a href="mailto:correo@ejemplo.com">correo@ejemplo.com</a>
